<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="busy" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#334155"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#475569" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Ventana -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#111827" stroke="#334155"/>
  <rect x="60" y="45" width="680" height="40" rx="14" fill="#1f2937"/>
  <rect x="60" y="70" width="680" height="15" fill="#1f2937"/>
  <circle cx="84" cy="65" r="6" fill="#ef4444"/>
  <circle cx="104" cy="65" r="6" fill="#eab308"/>
  <circle cx="124" cy="65" r="6" fill="#22c55e"/>
  <rect x="250" y="56" width="300" height="18" rx="9" fill="#0b0f17"/>
  <text x="400" y="69" font-size="11" fill="#94a3b8" text-anchor="middle">localhost:8080/recursos/sala-andes</text>

  <!-- Encabezado -->
  <text x="90" y="122" font-size="22" font-weight="700" fill="#f8fafc">Sala de reuniones Andes</text>
  <text x="90" y="145" font-size="13" fill="#94a3b8">Capacidad 8 personas · 08:00 – 20:00</text>
  <rect x="575" y="105" width="135" height="34" rx="17" fill="url(#acc)"/>
  <text x="642" y="127" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Reservar</text>

  <!-- Agenda: bloques de 30 min -->
  <g font-size="11" fill="#94a3b8">
    <text x="90" y="185">08:00</text><text x="90" y="235">10:00</text>
    <text x="90" y="285">12:00</text><text x="90" y="335">14:00</text>
  </g>
  <g>
    <!-- fila 1 -->
    <rect x="140" y="170" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="215" y="170" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="290" y="170" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="365" y="170" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="440" y="170" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="515" y="170" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="590" y="170" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <!-- fila 2: selección -->
    <rect x="140" y="220" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="215" y="220" width="218" height="34" rx="6" fill="url(#acc)"/>
    <text x="324" y="242" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">10:30 – 12:00 · Seleccionado</text>
    <rect x="440" y="220" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="515" y="220" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="590" y="220" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <!-- fila 3 -->
    <rect x="140" y="270" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="215" y="270" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="290" y="270" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="365" y="270" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="440" y="270" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="515" y="270" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="590" y="270" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <!-- fila 4 -->
    <rect x="140" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="215" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="290" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="365" y="320" width="68" height="34" rx="6" fill="url(#busy)"/>
    <rect x="440" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="515" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
    <rect x="590" y="320" width="68" height="34" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
  </g>

  <!-- Leyenda -->
  <rect x="140" y="372" width="14" height="14" rx="3" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="162" y="384" font-size="12" fill="#cbd5e1">Libre</text>
  <rect x="215" y="372" width="14" height="14" rx="3" fill="url(#busy)"/>
  <text x="237" y="384" font-size="12" fill="#cbd5e1">Ocupado</text>
  <rect x="455" y="368" width="203" height="24" rx="12" fill="#052e16" stroke="#22c55e"/>
  <text x="556" y="384" font-size="11" fill="#4ade80" text-anchor="middle">✓ Sin solapamientos garantizado</text>
</svg>
